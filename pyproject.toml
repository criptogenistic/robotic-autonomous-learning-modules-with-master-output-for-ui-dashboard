[build-system]
requires = ["setuptools >= 61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-rl-dashboard"
description = "Robotic Autonomous Learning Modules with Gymnasium v1.3.0 integration and UI Dashboard"
readme = "README.md"
requires-python = ">= 3.10"
authors = [{ name = "criptogenistic", email = "contact@robotic-learning.ai" }]
license = { text = "MIT License" }
keywords = ["Reinforcement Learning", "Robotics", "Gymnasium", "UI Dashboard", "Autonomous Learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.3.0",
    "numpy>=1.21.0",
    "cloudpickle>=1.2.0",
    "typing-extensions>=4.3.0",
    "farama-notifications>=0.0.1",
    "pygame-ce>=2.1.3",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
dynamic = ["version"]

[project.optional-dependencies]
atari = ["ale_py>=0.9"]
box2d = ["box2d==2.3.10", "pygame-ce>=2.1.3", "swig==4.*"]
classic-control = ["pygame-ce>=2.1.3"]
mujoco = ["mujoco>=2.1.5", "imageio>=2.14.1", "packaging>=23.0"]
toy-text = ["pygame-ce>=2.1.3"]
jax = [
    "jax>=0.4.16",
    "jaxlib>=0.4.16",
    "flax>=0.5.0",
    "array-api-compat>=1.11.0",
    "numpy>=2.1",
]
torch = ["torch>=1.13.0", "array-api-compat>=1.11.0", "numpy>=2.1"]
ui = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "websockets>=11.0",
]
testing = [
    "pytest>=7.1.3",
    "scipy>=1.7.3",
    "dill>=0.3.7",
    "array_api_extra>=0.7.0",
]

[project.urls]
Homepage = "https://robotic-learning.ai"
Repository = "https://github.com/criptogenistic/robotic-autonomous-learning-modules-with-master-output-for-ui-dashboard"
Documentation = "https://docs.robotic-learning.ai"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src", "src.*"]
